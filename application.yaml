apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: weather-dashboard
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Newbie0505/weather-dashboard-gitops.git
    targetRevision: main
    path: kubernetes

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true